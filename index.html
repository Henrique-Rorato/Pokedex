<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="assets/styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <h1 class="logo">Pokédex</h1>
            <nav class="nav">
                <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Search and Filter Section -->
        <section class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Buscar Pokémon por nome ou ID..."
                >
                <button class="search-btn" id="searchBtn">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div class="filters">
                <select id="typeFilter" class="filter-select">
                    <option value="">Todos os tipos</option>
                    <option value="normal">Normal</option>
                    <option value="fire">Fogo</option>
                    <option value="water">Água</option>
                    <option value="grass">Grama</option>
                    <option value="electric">Elétrico</option>
                    <option value="ice">Gelo</option>
                    <option value="fighting">Lutador</option>
                    <option value="poison">Veneno</option>
                    <option value="ground">Terra</option>
                    <option value="flying">Voador</option>
                    <option value="psychic">Psíquico</option>
                    <option value="bug">Inseto</option>
                    <option value="rock">Rocha</option>
                    <option value="ghost">Fantasma</option>
                    <option value="dragon">Dragão</option>
                    <option value="dark">Sombrio</option>
                    <option value="steel">Aço</option>
                    <option value="fairy">Fada</option>
                </select>
                <select id="orderFilter" class="filter-select">
                    <option value="id-asc">Ordenar por ID (crescente)</option>
                    <option value="id-desc">Ordenar por ID (decrescente)</option>
                    <option value="name-asc">Ordenar por nome (A → Z)</option>
                </select>
            </div>
        </section>

        <!-- Pokemon Grid -->
        <section class="pokemon-grid" id="pokemonGrid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Carregando Pokémon...</p>
            </div>
        </section>
        <div id="pagination" class="pagination"></div>
    </main>

    <!-- Pokemon Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeBtn">&times;</button>
            <div id="modalBody" class="modal-body">
                <!-- Pokemon details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="assets/scripts/app.js"></script>
</body>
</html>
